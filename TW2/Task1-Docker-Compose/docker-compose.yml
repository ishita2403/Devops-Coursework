version: "3.9"

services:

  db:
    image: postgres:16

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:

    build: .

    container_name: flask-app

    depends_on:
      - db

    ports:
      - "5002:5000"

volumes:

  postgres_data: